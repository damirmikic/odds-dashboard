# nginx alternative to the Caddyfile, for a server that already runs nginx: /etc/nginx/sites-available/xtip
# Password: htpasswd -c /etc/nginx/xtip.htpasswd damir   (apache2-utils)
# HTTPS:    certbot --nginx -d oddsmonitor.merkurxtip.app   (adds the 443 server block and the redirect)
server {
    listen 80;
    server_name oddsmonitor.merkurxtip.app;

    auth_basic "Xtip Monitor";
    auth_basic_user_file /etc/nginx/xtip.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # who set a value mark (Obrađeno column)
        proxy_set_header X-Remote-User $remote_user;
        # a full snapshot of every sport can take a while
        proxy_read_timeout 120s;
    }
}
